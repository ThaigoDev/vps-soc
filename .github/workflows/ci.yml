name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: Agente (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: agent/go.mod
      - name: gofmt
        working-directory: agent
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: agent
        run: go vet ./...
      # sudo: the exec-event test needs root (it is skipped otherwise)
      - name: test
        working-directory: agent
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -race ./...
      - name: build
        working-directory: agent
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/vps-soc-agent

  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner)
      - name: test
        working-directory: backend
        run: sh ./mvnw -B -q verify

  frontend:
    name: Painel (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: build
        working-directory: frontend
        run: npm run build
